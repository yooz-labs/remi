name: Relay R7 local gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

# Manual runs stay independent; only a newer head of this PR cancels its old soak.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Relay Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relay: ${{ steps.scope.outputs.relay }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-scope
        id: scope

  local-relay:
    needs: [scope]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      BUN_VERSION: 1.3.11
      E2E_BUNDLER: esbuild
    steps:
      - name: Fail unvalidated scope
        if: needs.scope.result != 'success'
        run: |
          echo "CI scope validation failed; runtime checks were not started." >&2
          exit 1
      - uses: actions/checkout@v5
        if: needs.scope.result == 'success' && needs.scope.outputs.relay != 'false'
      - uses: oven-sh/setup-bun@v2
        if: needs.scope.result == 'success' && needs.scope.outputs.relay != 'false'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        if: needs.scope.result == 'success' && needs.scope.outputs.relay != 'false'
      - name: Existing actual wire and authority controls
        if: needs.scope.result == 'success' && needs.scope.outputs.relay != 'false'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p r7-receipts
          git rev-parse HEAD | tee r7-receipts/head.txt
          bun --version | tee r7-receipts/bun.txt
          bun test packages/signaling/tests/e2e \
            packages/web/tests/relay-machine-channel.test.ts \
            packages/web/tests/relay-client-outcomes.test.ts \
            tests/integration/relay-r3*.test.ts \
            tests/integration/relay-r6-ingress.test.ts \
            tests/integration/relay-r7*.test.ts 2>&1 | tee r7-receipts/controls.log
      - name: Same attached session for 61 actual minutes
        if: needs.scope.result == 'success' && needs.scope.outputs.relay != 'false'
        shell: bash
        env:
          REMI_RELAY_R7_SOAK: '1'
        run: |
          set -o pipefail
          bun test --timeout 4500000 packages/web/tests/relay-r7-soak.test.ts 2>&1 | tee r7-receipts/soak.log
      - uses: actions/upload-artifact@v4
        if: always() && (needs.scope.result == 'success' && needs.scope.outputs.relay != 'false')
        with:
          name: relay-r7-local-${{ github.run_id }}
          path: r7-receipts/
      - name: Report scoped skip
        if: needs.scope.result == 'success' && needs.scope.outputs.relay == 'false'
        run: echo "Relay gate skipped; no relay inputs changed." >> "$GITHUB_STEP_SUMMARY"
