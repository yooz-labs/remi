# typos (crate-ci/typos) configuration.
#
# Exclude captured-PTY test fixtures: these are real Claude Code terminal
# output saved verbatim for no-mock parser tests. ANSI stripping collapses the
# spacing (e.g. "Output ONLY a..." becomes "OutputONLYa..."), which the spell
# checker mis-tokenizes (e.g. "ONL"). They are data, not prose.
[files]
extend-exclude = [
  "packages/daemon/tests/parser/fixtures/",
  # Captured AskUserQuestion TUI sessions (#627) — raw terminal bytes, not prose.
  "packages/daemon/tests/fixtures/auq/",
  # Xcode project files are machine-format: 24-hex object IDs (e.g.
  # "719E75D1BA17...") tokenize into false-positive "words" like BA (#719).
  "*.pbxproj",
  # Same 24-hex BlueprintIdentifier issue in generated scheme files (#649).
  "*.xcscheme",
  # Redacted hook-capture corpus (#886 part 2): pseudonymized ids are
  # deterministic pseudo-random alnum strings, not prose, and occasionally
  # contain word-like substrings by chance (e.g. "giv", "yoy") that trip the
  # spell checker. See fixtures/build-hook-corpus.ts for how these are
  # generated.
  "packages/daemon/tests/hooks/fixtures/hook-corpus.jsonl",
]
