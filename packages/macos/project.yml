# xcodegen source for Remi.xcodeproj (#649). The GENERATED project is
# checked in — xcodegen is NOT a build dependency; this file exists so the
# project can be regenerated deterministically (`xcodegen generate` in this
# directory) when targets/files change.
name: Remi
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 9DQ459HAZB
    # NativeAPNsEnvironment.swift calls the Objective-C self-entitlement query
    # (#1200); both the app and the un-hosted tests compile it.
    SWIFT_OBJC_BRIDGING_HEADER: Remi/NativePush/NativePush-Bridging-Header.h
targets:
  Remi:
    type: application
    platform: macOS
    sources:
      - path: Remi
        excludes:
          - "Resources/web/**"
          - "NativePush/README.md"
      # Staged web bundle (scripts/stage-macos-web.sh). Folder reference so
      # the whole dist tree lands in Resources/web verbatim.
      - path: Remi/Resources/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.remi
        PRODUCT_NAME: Remi
        INFOPLIST_FILE: Remi/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Remi/Remi.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Placeholder values: generate-macos-project.sh re-stamps both from
        # config/app-release.json after every regeneration (#658).
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 4
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Remi.entitlements signs $(APNS_ENVIRONMENT). The runtime query, not this
      # value, chooses the environment a push registration reports (#1200).
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    preBuildScripts:
      - name: Verify staged web bundle
        script: |
          if [ ! -f "${SRCROOT}/Remi/Resources/web/index.html" ]; then
            echo "error: web bundle not staged. Run: bun run build:macos-web (repo root)"
            exit 1
          fi
        basedOnDependencyAnalysis: false
  RemiTests:
    type: bundle.unit-test
    platform: macOS
    # UN-hosted tests: app sources compile INTO the test bundle (excluding
    # the @main entry) instead of using the app as TEST_HOST. A hosted-app
    # failure deadlocks XCTest's issue recording inside the accessory app's
    # run loop (observed live: a failed assert hung xcodebuild forever) —
    # unacceptable for CI. Plain xctest bundles fail fast.
    sources:
      # Fixtures are read by path (#filePath) or compiled by a test at run time
      # (NativePushStateProcess/main.swift is a standalone helper executable),
      # so none belongs in the bundle.
      - path: RemiTests
        excludes:
          - "fixtures/**"
      - path: Remi
        excludes:
          - "RemiApp.swift"
          - "Resources/web/**"
          - "NativePush/README.md"
      # The shipping iOS notification service extension, so tests construct the
      # actual class (#1200). It is also compiled by packages/web/ios.
      - path: ../web/ios/App/RemiNotificationService/NotificationService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.remi.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Remi:
    build:
      targets:
        Remi: all
        RemiTests: [test]
    test:
      targets:
        - RemiTests
